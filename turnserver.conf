# MeetClone TURN Server Configuration (coturn)
# For NAT traversal in WebRTC connections

# Server name and realm
realm=meetclone.example.com
server-name=meetclone-turn

# Network settings
listening-port=3478
tls-listening-port=5349

# Listen on all interfaces
listening-ip=0.0.0.0

# External IP (MUST be set for production)
# Replace with your actual public IP
# external-ip=YOUR_PUBLIC_IP

# Relay settings
min-port=49152
max-port=65535

# Authentication
# Use long-term credentials
lt-cred-mech

# Static user (for testing - use database auth in production)
# user=meetclone:meetclone-turn-secret

# Or use REST API for dynamic credentials
use-auth-secret
static-auth-secret=${TURN_SECRET:-meetclone-turn-secret}

# Logging
log-file=/var/log/turnserver/turnserver.log
verbose

# Security
no-cli
no-tcp-relay
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=224.0.0.0-247.255.255.255

# Allow only UDP relay (recommended for WebRTC)
no-tcp-relay

# Fingerprint for TURN messages
fingerprint

# Performance tuning
proc-quota-multiplier=2048

# TLS settings (uncomment and configure for production)
# cert=/etc/ssl/certs/turn_server_cert.pem
# pkey=/etc/ssl/private/turn_server_pkey.pem
# cipher-list="ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512"
